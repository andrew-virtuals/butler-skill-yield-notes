name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: Virtual-Protocol/butler-skills/.github/actions/validate@main
      - uses: Virtual-Protocol/butler-skills/.github/actions/validate@main
        with:
          path: templates/options-lifecycle
          params: '{}'
      - uses: Virtual-Protocol/butler-skills/.github/actions/validate@main
        with:
          path: templates/options-put-delivery
          params: '{"INSTRUMENT":"ETH-20261030-2450-P","UNDERLYING":"ETH","TOKEN_ID":"native:8453","STRIKE":2450,"SIZE":2.04,"PREMIUM_USD":55.17,"COLLATERAL_USD":4998}'
      - uses: Virtual-Protocol/butler-skills/.github/actions/validate@main
        with:
          path: templates/options-account
      - uses: Virtual-Protocol/butler-skills/.github/actions/validate@main
        with:
          path: templates/options-order-manager
          params: '{"INSTRUMENT":"ETH-20261204-3000-P","ACTION":"open","SIZE":2,"WORST_PRICE":47,"FEE_USD":1.5}'
      - name: Template unit tests
        run: |
          python3 -m unittest discover -s templates/options-lifecycle/tests -v
          python3 -m unittest discover -s templates/options-put-delivery/tests -v
          python3 -m unittest discover -s templates/options-account/tests -v
          python3 -m unittest discover -s templates/options-order-manager/tests -v
          python3 -m unittest discover -s tests -v
